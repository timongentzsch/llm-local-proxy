[package]
name = "llm-local-proxy"
version = "0.4.0"
edition = "2021"
description = "A local OpenAI- and Anthropic-compatible gateway for Codex and Claude subscriptions"
license = "MIT"
rust-version = "1.80"

[[bin]]
name = "llm-local-proxy"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.2"
indexmap = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "process", "sync", "time", "macros", "signal", "fs"] }
tokio-stream = "0.1"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
