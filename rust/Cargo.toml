[package]
name = "llm-local-proxy"
version = "0.4.0"
edition = "2021"
description = "A local OpenAI- and Anthropic-compatible gateway for Codex and Claude subscriptions"
license = "MIT"
rust-version = "1.82"

[[bin]]
name = "llm-local-proxy"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "process", "sync", "time", "macros", "signal", "fs"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
