<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex Local Proxy</title>
<style>
  :root{color-scheme:light dark;font:14px ui-monospace,SFMono-Regular,Consolas,monospace}
  body{max-width:640px;margin:64px auto;padding:0 20px;line-height:1.5}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}
  h1{font-size:16px;margin:0}h2{font-size:14px;margin:32px 0 8px}
  .muted{opacity:.6}.row{display:flex;gap:12px;justify-content:space-between;border-top:1px solid #8884;padding:9px 0}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#888;margin-right:7px}.dot.on{background:#16a34a}
  .spin{display:none;width:9px;height:9px;border:2px solid #8885;border-top-color:currentColor;border-radius:50%;margin-right:7px;animation:spin .7s linear infinite}
  body.loading .spin{display:inline-block}body.loading .dot{display:none}
  body:not(.ready).loading .remote{color:transparent;background:#8882;border-radius:3px;min-width:12ch;animation:pulse 1s ease-in-out infinite}
  button{font:inherit;border:1px solid #8886;border-radius:4px;background:none;color:inherit;padding:5px 9px;cursor:pointer}
  button:hover{border-color:#888}code{font:inherit;word-break:break-all}input{font:inherit;border:1px solid #8886;border-radius:4px;background:none;color:inherit;padding:5px 9px;flex:1;min-width:0}.actions{display:flex;gap:8px;margin:20px 0}#login{display:none}
  .limit{margin:10px 0}.bar{height:3px;background:#8884}.bar i{display:block;height:100%;background:currentColor}
  #models{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}.model{display:inline-flex;align-items:center;gap:5px;border:1px solid #8885;border-radius:999px;padding:3px 8px}
  [hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.45}}
</style>
<header><h1>codex local proxy</h1><span><i class="spin"></i><i id="dot" class="dot"></i><span id="state">loading</span></span></header>
<main>
  <div class="row"><span class="muted">account</span><span id="account" class="remote">loading</span></div>
  <div class="row"><span class="muted">models</span><span id="models" class="remote">loading</span></div>
  <section id="limits"><div class="limit remote">loading limits</div></section>
  <section id="login">
    <h2>device login</h2>
    <p>Open <a id="verify" target="_blank" rel="noreferrer">the device page</a> and enter <code id="code"></code>.</p>
  </section>
  <section id="claude" hidden>
    <h2>claude subscription</h2>
    <div class="row"><span class="muted">account</span><span id="claude-state">loading</span></div>
    <div class="row" id="claude-expires" hidden><span class="muted">token expires</span><span id="claude-expiry"></span></div>
    <div id="claude-login" hidden>
      <p>Open <a id="claude-url" target="_blank" rel="noreferrer">the sign in page</a>, approve, then paste the code from the callback page below.</p>
      <div class="row"><input id="claude-code" type="text" placeholder="paste the code" autocomplete="off"><button id="claude-confirm">confirm</button></div>
    </div>
    <div class="actions"><button id="claude-signin" hidden>claude sign in</button><button id="claude-logout" hidden>claude sign out</button></div>
  </section>
  <div class="actions"><button id="signin">codex sign in</button><button id="refresh">refresh</button><button id="logout" hidden>codex sign out</button></div>
  <h2>client</h2>
  <div class="row"><span class="muted">base url</span><code id="base"></code></div>
  <div class="row"><span class="muted">api key</span><span><code id="key"></code> <button id="copy">copy</button></span></div>
</main>
<script>
const authRequired=__AUTH_REQUIRED__,key=new URLSearchParams(location.hash.slice(1)).get("key")||"",q=s=>document.querySelector(s);if(key)history.replaceState(null,"",location.pathname+location.search);
let active=0;
function busy(delta){active+=delta;document.body.classList.toggle("loading",active>0)}
async function api(path,options={}){busy(1);try{const headers={"Content-Type":"application/json"};if(key)headers.Authorization=`Bearer ${key}`;const r=await fetch(path,{...options,headers}),j=await r.json();if(!r.ok)throw Error(j.error?.message||j.error||r.statusText);return j}finally{busy(-1)}}
function windowName(minutes){if(minutes===300)return"5 hour";if(minutes===10080)return"weekly";if(minutes%1440===0)return`${minutes/1440} day`;if(minutes%60===0)return`${minutes/60} hour`;return`${minutes} minute`}
function showLimits(value){const root=q("#limits");root.replaceChildren();for(const item of Object.values(value?.rateLimitsByLimitId||{})){for(const window of [item.primary,item.secondary]){if(!window)continue;const used=window.usedPercent??0,box=document.createElement("div"),bar=document.createElement("div"),fill=document.createElement("i"),reset=window.resetsAt?` · resets ${new Date(window.resetsAt*1000).toLocaleString()}`:"";box.className="limit";box.textContent=`${item.limitName||item.limitId} · ${windowName(window.windowDurationMins)} · ${used}% used${reset}`;bar.className="bar";fill.style.width=`${Math.min(100,used)}%`;bar.append(fill);box.append(bar);root.append(box)}}}
function showModels(models){const root=q("#models");root.replaceChildren();for(const model of models){const pill=document.createElement("code");pill.className="model";pill.title=model.name;pill.textContent=model.id;root.append(pill)}}
async function load(){
  const [status,models]=await Promise.allSettled([api("/api/status"),api("/v1/models")]);
  if(models.status==="fulfilled")showModels(models.value.data);else q("#models").textContent="unavailable";
  if(status.status==="fulfilled"){
    const s=status.value,a=s.account;q("#dot").classList.toggle("on",!!a);q("#state").textContent=a?"signed in":"signed out";
    q("#account").textContent=a?`${a.email||"ChatGPT"} · ${a.planType||a.type}`:"not authenticated";
    showLimits(s.rate_limits);q("#signin").hidden=!!a;q("#logout").hidden=!a;showClaude(s.claude);
  }else{q("#state").textContent=status.reason.message;q("#account").textContent="unavailable";q("#limits").replaceChildren()}
  document.body.classList.add("ready");
}
q("#signin").onclick=async()=>{try{const r=await api("/api/login",{method:"POST",body:"{}"}),url=new URL(r.verificationUrl);if(url.protocol!=="https:")throw Error("invalid verification URL");q("#verify").href=url;q("#code").textContent=r.userCode;q("#login").style.display="block";window.open(url,"_blank","noopener")}catch(e){alert(e.message)}};
q("#logout").onclick=async()=>{await api("/api/logout",{method:"POST",body:"{}"});load()};
function showClaude(c){const root=q("#claude");if(!c){root.hidden=true;return}root.hidden=false;const on=!!c.signed_in;q("#claude-state").textContent=on?`${c.subscription_type||"claude"} \u00b7 signed in`:"not signed in";q("#claude-expires").hidden=!on;if(on&&c.expires_at)q("#claude-expiry").textContent=new Date(c.expires_at*1000).toLocaleString();q("#claude-signin").hidden=on;q("#claude-logout").hidden=!on;q("#claude-login").hidden=on}
q("#claude-signin").onclick=async()=>{try{const r=await api("/api/claude/login",{method:"POST",body:"{}"});q("#claude-url").href=r.url;q("#claude-login").hidden=false;window.open(r.url,"_blank","noopener")}catch(e){alert(e.message)}};
q("#claude-confirm").onclick=async()=>{try{await api("/api/claude/code",{method:"POST",body:JSON.stringify({code:q("#claude-code").value})});q("#claude-code").value="";q("#claude-login").hidden=true;load()}catch(e){alert(e.message)}};
q("#claude-logout").onclick=async()=>{await api("/api/claude/logout",{method:"POST",body:"{}"});load()};
q("#copy").onclick=async()=>{await navigator.clipboard.writeText(key);q("#copy").textContent="copied"};
q("#base").textContent=`${location.origin}/v1`;q("#key").textContent=key||(authRequired?"missing from URL":"disabled");q("#copy").style.display=key?"":"none";q("#refresh").onclick=load;
if(authRequired&&!key){q("#state").textContent="api key required";q("#account").textContent="open the startup URL";q("#models").textContent="unavailable";q("#limits").replaceChildren();q("#signin").disabled=true;q("#refresh").disabled=true;document.body.classList.add("ready")}else{load();setInterval(load,60000)}
</script>
</html>
