<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM Local Proxy</title>
<style>
  :root{color-scheme:light dark;font:13px ui-monospace,SFMono-Regular,Consolas,monospace;--line:#8884;--green:#16a34a}
  *{box-sizing:border-box}body{max-width:1040px;margin:28px auto;padding:0 18px 48px;line-height:1.45}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding:0 2px}
  h1{font-size:16px;margin:0}h2{font-size:13px;margin:0}.muted{opacity:.62}
  .panel,.provider{border:1px solid var(--line);overflow:hidden}.provider{display:flex;flex-direction:column}
  .panel{margin-top:12px;padding:14px}.section-head,.provider-head,.account-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .section-head{margin-bottom:10px}.provider-head{padding:12px 14px;border-bottom:1px solid var(--line)}
  #providers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .provider-controls,.account-controls{display:flex;align-items:center;gap:6px}.summary{font-size:11px;border:1px solid var(--line);padding:2px 7px;white-space:nowrap}.add-account,.remove{padding:2px 7px;font-size:11px}
  .row{display:flex;gap:12px;justify-content:space-between;border-top:1px solid var(--line);padding:7px 0}
  .dot,.account-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#888;margin-right:7px}.dot.on,.account-slot.signed .account-dot{background:var(--green)}
  .spin{display:none;width:9px;height:9px;border:2px solid #8885;border-top-color:currentColor;border-radius:50%;margin-right:7px;animation:spin .7s linear infinite}
  body.loading .spin{display:inline-block}body.loading .dot{display:none}
  button,select,input{font:inherit;border:1px solid #8886;border-radius:0;background:none;color:inherit;padding:4px 8px}button{cursor:pointer}
  button:hover{border-color:#888}code{font:inherit;word-break:break-all}input{flex:1;min-width:0}.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
  .login-address{display:flex;align-items:flex-start;gap:8px;min-width:0}.login-url{word-break:break-all}
  .limit{margin:7px 0;font-size:11px}.bar{height:3px;background:#8884;margin-top:3px}.bar i{display:block;height:100%;background:currentColor}
  .accounts{display:flex;flex:1;flex-direction:column}.account-slot{padding:11px 14px}.account-slot+.account-slot{border-top:1px solid var(--line)}.account-slot:last-child{flex:1}.account-slot:not(.signed):last-child{display:flex;flex-direction:column}.account-slot:not(.signed):last-child>.actions{margin-top:auto}.identity{min-width:0}.account-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.account-meta{display:block;margin:1px 0 0 14px;font-size:11px;opacity:.62}.signout{padding:2px 7px;font-size:11px}.usage:empty{display:none}.stamp{font-size:10px}.login{margin-top:9px}.login .row{align-items:flex-start}.login-hint{font-size:11px;margin:6px 0}.paste{display:flex}
  #clients{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#clients .row{display:block;border:1px solid var(--line);padding:7px 9px}#clients code{display:block;margin-top:2px}
  .key-row{margin-top:8px;align-items:center}.key-row code{margin-left:auto}.command{display:grid;grid-template-columns:100px minmax(0,1fr);align-items:start;gap:10px;padding:8px 0}.command:first-child{border-top:0}.command>.muted{padding-top:8px}.command-code{position:relative;min-width:0;background:#8881;border:1px solid var(--line)}.command code{display:block;overflow-x:auto;word-break:normal;white-space:pre;padding:7px 62px 7px 9px}.command-copy{position:absolute;inset:-1px -1px -1px auto;white-space:nowrap;background:Canvas}#command-model{max-width:55%;margin-left:auto}
  #models{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}.model{padding:8px 0;border-top:1px solid var(--line)}.model-main{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.model-context{white-space:nowrap}.efforts{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.effort{border:1px solid #8885;padding:0 6px;font-size:10px}.efforts-empty{opacity:.6;font-size:10px}
  .skeleton-line,.skeleton-code,.skeleton-button{display:block;background:linear-gradient(90deg,#8881 25%,#8883 50%,#8881 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}.skeleton-line{height:9px}.skeleton-provider .provider-head{height:43px}.skeleton-provider .account-slot{min-height:76px}.skeleton-provider .actions{margin-top:12px}.skeleton-client .skeleton-line+ .skeleton-line{margin-top:7px}.skeleton-code{height:31px}.skeleton-button{width:48px;height:27px;border:1px solid var(--line)}.skeleton-code .skeleton-button{position:absolute;inset:-1px -1px -1px auto;height:auto}.skeleton-model .skeleton-line{margin-top:1px}.skeleton-model .efforts{margin-top:7px}.skeleton-model .efforts .skeleton-line{height:12px}
  @media(max-width:720px){body{margin-top:18px}#providers,#clients,#models{grid-template-columns:1fr}.command{grid-template-columns:1fr;gap:5px}#command-model{max-width:65%}}
  @media(prefers-reduced-motion:reduce){.skeleton-line,.skeleton-code,.skeleton-button{animation:none}}
  body.user .master,body:not(.user) .user-only{display:none!important}
  .keys-add{display:flex;gap:6px}.key-item{border-top:1px solid var(--line);padding:9px 0}.key-item:first-child{border-top:0}.key-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.key-head code{opacity:.7}.key-actions{display:flex;gap:6px}.key-actions button{padding:2px 7px;font-size:11px}#command-key{max-width:14em}
  [hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@keyframes shimmer{to{background-position:-200% 0}}
</style>
<header><h1>llm local proxy</h1><span><i class="spin"></i><i id="dot" class="dot"></i><span id="state" role="status">loading</span></span></header>
<form id="unlock" class="panel" hidden>
  <div class="section-head"><h2>api key required</h2></div>
  <p class="login-hint muted">Paste an api key, or open a link that carries one, like the one printed at startup.</p>
  <div class="keys-add"><input id="unlock-key" type="password" placeholder="api key" aria-label="api key" autocomplete="off"><button>open</button></div>
</form>
<main>
  <div id="providers" class="master"></div>
  <section class="panel user-only">
    <div class="section-head"><h2>your usage</h2></div>
    <div id="usage" class="usage"></div>
  </section>
  <section class="panel master">
    <div class="section-head"><h2>keys</h2><span class="keys-add"><input id="key-name" placeholder="new key name" aria-label="new key name" autocomplete="off"><button id="add-key">add key</button></span></div>
    <div id="keys"></div>
  </section>
  <section class="panel">
    <div class="section-head"><h2>connection</h2></div>
    <div id="clients"></div>
    <div class="row key-row"><span class="muted">api key</span><code id="key"></code><span><button id="copy">copy</button> <button id="forget">forget</button></span></div>
  </section>
  <section class="panel">
    <div class="section-head"><h2>launch a client</h2><span><select id="command-key" class="master" aria-label="key"></select> <select id="command-model" aria-label="model" disabled><option>loading models</option></select></span></div>
    <div id="commands"></div>
  </section>
  <section class="panel">
    <div class="section-head"><h2>models</h2><button id="refresh-models">refresh</button></div>
    <div id="models"></div>
  </section>
</main>
<template id="skeleton-provider">
  <section class="provider skeleton-provider" aria-hidden="true">
    <div class="provider-head"><span class="skeleton-line" style="width:8ch"></span><span class="skeleton-line" style="width:11ch"></span></div>
    <div class="accounts">
      <div class="account-slot"><span class="skeleton-line" style="width:44%"></span><span class="skeleton-line" style="width:29%;margin:7px 0 0 14px"></span><div class="actions"><span></span><span class="skeleton-button"></span></div></div>
      <div class="account-slot"><span class="skeleton-line" style="width:39%"></span><span class="skeleton-line" style="width:32%;margin:7px 0 0 14px"></span><div class="actions"><span></span><span class="skeleton-button"></span></div></div>
    </div>
  </section>
</template>
<template id="skeleton-client"><div class="row skeleton-client" aria-hidden="true"><span class="skeleton-line" style="width:20ch"></span><span class="skeleton-line" style="width:74%"></span></div></template>
<template id="skeleton-command"><div class="row command skeleton-command" aria-hidden="true"><span class="skeleton-line" style="width:7ch;margin-top:10px"></span><span class="command-code skeleton-code"><span class="skeleton-button"></span></span></div></template>
<template id="skeleton-model"><div class="model skeleton-model" aria-hidden="true"><div class="model-main"><span class="skeleton-line" style="width:42%"></span><span class="skeleton-line" style="width:13ch"></span></div><div class="efforts"><span class="skeleton-line" style="width:7ch"></span><span class="skeleton-line" style="width:6ch"></span></div></div></template>
<template id="provider-card">
  <section class="provider">
    <div class="provider-head"><h2 class="title"></h2><div class="provider-controls"><div class="summary muted"></div><button class="add-account">add account</button></div></div>
    <div class="accounts"></div>
  </section>
</template>
<template id="account-card">
  <div class="account-slot">
    <div class="account-head">
      <div class="identity"><strong class="account-name"><i class="account-dot"></i><span class="account-label">loading</span></strong><span class="account-meta"></span></div>
      <span class="account-controls"><button class="signout" hidden>sign out</button><button class="remove" hidden>remove</button></span>
    </div>
    <div class="usage"></div>
    <div class="actions"><span class="muted stamp"></span><button class="signin"></button></div>
    <div class="login" hidden>
      <div class="row"><span class="muted">sign in URL</span><span class="login-address"><code class="login-url"></code><button class="copy-login">copy</button></span></div>
      <p class="login-hint"></p>
      <div class="row paste" hidden><input class="login-code" type="text" placeholder="paste the code" autocomplete="off"><button class="confirm">confirm</button></div>
    </div>
  </div>
</template>
<script>
const authRequired=__AUTH_REQUIRED__,STORE="llm-local-proxy.key",q=s=>document.querySelector(s);
function fillSkeleton(root,template,count){for(let i=0;i<count;i++)q(root).append(q(template).content.cloneNode(true))}
fillSkeleton("#providers","#skeleton-provider",2);fillSkeleton("#clients","#skeleton-client",2);fillSkeleton("#commands","#skeleton-command",4);fillSkeleton("#models","#skeleton-model",4);
// The key arrives once in the URL fragment, which never reaches the server.
// Keep it in storage scoped to this origin so a refresh still works, and drop
// it from the address bar so it cannot be bookmarked or shared by accident.
function storedKey(){try{return localStorage.getItem(STORE)||""}catch{return""}}
function rememberKey(v){try{localStorage.setItem(STORE,v)}catch{}}
function forgetKey(){try{localStorage.removeItem(STORE)}catch{}key=""}
function hashKey(){return new URLSearchParams(location.hash.slice(1)).get("key")||""}
function takeKey(){const v=hashKey();if(!v)return storedKey();history.replaceState(null,"",location.pathname+location.search);rememberKey(v);return v}
// Pasting the startup link into a tab that is already open changes only the
// fragment, which the browser treats as a same-document navigation: without
// this the page would keep running with the old key and look unresponsive.
addEventListener("hashchange",()=>{if(hashKey())location.reload()});
// The 60s reload re-renders only what changed, so it does not steal a text
// selection, an open model list or focus from the panels below.
let key=takeKey(),active=0,providers=[],dialects=[],modelList=[],shownDialects="",shownModels="",shownCommands="",refreshing=false,loading=null,again=false,timer,keysInfo=null;
// Named keys start with llp_: hide the master-only panels before /api/me
// answers, rather than flashing them at a key that will never get them.
document.body.classList.toggle("user",key.startsWith("llp_"));
function busy(delta){active+=delta;document.body.classList.toggle("loading",active>0)}
async function api(path,options={}){busy(1);try{const headers={"Content-Type":"application/json"};if(key)headers.Authorization=`Bearer ${key}`;const r=await fetch(path,{...options,headers}),j=await r.json().catch(()=>({}));if(!r.ok){const e=Error(j.error?.message||j.error||r.statusText);e.status=r.status;throw e}return j}finally{busy(-1)}}
const timeFmt=new Intl.DateTimeFormat(undefined,{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,timeZoneName:"short"});
function fmtTime(v){if(v==null||v==="")return"";const n=Number(v);let d=Number.isFinite(n)&&n>1e9?new Date(n>1e12?n:n*1000):new Date(v);return isNaN(d)?String(v):timeFmt.format(d)}
function fmtTokens(n){if(!n)return"0";if(n>=1e9)return(n/1e9).toFixed(2)+"B";if(n>=1e6)return(n/1e6).toFixed(2)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"k";return String(n)}
function windowLabel(w){return w==="5h"?"5 hour":w==="7d"?"weekly":w}
function bar(root,label,percent,resetsAt){const pct=Math.min(100,Math.round(percent||0));const box=document.createElement("div"),line=document.createElement("div"),fill=document.createElement("i");const reset=resetsAt?` · resets ${fmtTime(resetsAt)}`:"";box.className="limit";box.textContent=`${label} · ${pct}% used${reset}`;line.className="bar";fill.style.width=pct+"%";line.append(fill);box.append(line);root.append(box)}
function hasTokens(t){return !!(t&&Object.values(t).some(w=>w&&(w.input||w.output||w.cache_read||w.cache_write||w.partial_requests)))}
function tokenLine(t){const read=t.cache_read||0,input=(t.input||0)+read+(t.cache_write||0);let s=`${fmtTokens(input)} in`;if(input&&read)s+=` · ${Math.round(read/input*100)}% cache hits`;return`${s} · ${fmtTokens(t.output||0)} out${t.partial_requests?" · includes partial usage":""}`}
function showTokens(root,tokens,prefix="proxy tokens"){if(!hasTokens(tokens))return;let shown="";for(const w of Object.keys(tokens)){const t=tokens[w];if(!t||(!t.input&&!t.output&&!t.cache_read&&!t.cache_write&&!t.partial_requests))continue;const line=tokenLine(t);if(line===shown)continue;shown=line;const div=document.createElement("div");div.className="limit";div.textContent=`${prefix} · ${windowLabel(w)}: ${line}`;root.append(div)}}
function providerCard(name){let c=document.getElementById(`provider-${name}`);if(c)return c;q("#providers").querySelectorAll(".skeleton-provider").forEach(item=>item.remove());c=q("#provider-card").content.firstElementChild.cloneNode(true);c.id=`provider-${name}`;c.querySelector(".add-account").onclick=async()=>{try{await api(`/api/${name}/accounts`,{method:"POST",body:JSON.stringify({action:"add"})});load()}catch(e){alert(e.message)}};q("#providers").append(c);return c}
function accountCard(name,id,root){let c=root.querySelector(`[data-account="${id}"]`);if(c)return c;c=q("#account-card").content.firstElementChild.cloneNode(true);c.dataset.account=id;root.append(c);wire(name,id,c);return c}
function accountBody(id,extra={}){return JSON.stringify({...extra,...(id?{account:id}:{})})}
function wire(name,id,c){
  const login=c.querySelector(".login"),loginUrl=c.querySelector(".login-url"),copyLogin=c.querySelector(".copy-login");
  c.querySelector(".signin").onclick=async()=>{try{const r=await api(`/api/${name}/login`,{method:"POST",body:accountBody(id)}),url=new URL(r.url);if(url.protocol!=="https:")throw Error("invalid sign in URL");loginUrl.textContent=url.href;c.querySelector(".login-hint").textContent=r.code?`Open the URL and enter ${r.code}.`:"Open the URL, approve access, then paste the code from the callback page below.";c.querySelector(".paste").hidden=!!r.code;copyLogin.textContent="copy";login.dataset.account=r.account||id;login.hidden=false}catch(e){alert(e.message)}};

function showProvider(p){
  const c=providerCard(p.name),items=p.accounts||[],root=c.querySelector(".accounts");

  c.querySelector(".summary").textContent=`${connected}/${items.length} connected`;
  c.querySelector(".add-account").hidden=!(p.routes||[]).includes("accounts")||items.some(a=>!a.signed_in);
  const ids=new Set(items.map(a=>a.id||""));for(const slot of root.querySelectorAll(".account-slot")){if(!ids.has(slot.dataset.account))slot.remove()}
  for(const a of items){const id=a.id||"",slot=accountCard(p.name,id,root),on=!!a.signed_in,parts=String(a.account||"").split(" · ").filter(Boolean),name=parts.shift()||`${p.name} account`;slot.classList.toggle("signed",on);slot.querySelector(".account-label").textContent=a.error?"unavailable":on?name:`add ${p.name} login`;slot.querySelector(".account-meta").textContent=a.error?a.error:on?[...parts,...(a.draining?["new sessions paused"]:[])].join(" · "):"available login slot";slot.querySelector(".signin").textContent="sign in";slot.querySelector(".signin").hidden=on;slot.querySelector(".signout").hidden=!on;slot.querySelector(".remove").hidden=on;if(on)slot.querySelector(".login").hidden=true;const usage=slot.querySelector(".usage");usage.replaceChildren();if(on){for(const limit of a.limits||[])bar(usage,limit.label,limit.used_percent,limit.resets_at);if(!(a.limits||[]).length){const none=document.createElement("div");none.className="limit muted";none.textContent="limits unavailable";usage.append(none)}showTokens(usage,a.tokens||{})}slot.querySelector(".stamp").textContent=on&&a.updated_at?`updated ${fmtTime(a.updated_at)}`:""}
}
function showDialects(items){const root=q("#clients"),sig=JSON.stringify(items);if(sig===shownDialects&&root.querySelector(".row:not(.skeleton-client)"))return;shownDialects=sig;dialects=items;root.replaceChildren();for(const d of items){const row=document.createElement("div");row.className="row";const label=document.createElement("span");label.className="muted";label.textContent=`${d.name} base url`;const value=document.createElement("code");value.textContent=d.base_url;row.append(label,value);root.append(row)}showCommands()}
function fmtContext(n){n=Number(n);if(!Number.isFinite(n)||n<=0)return"context unknown";if(n>=1e6&&n%1e6===0)return`${n/1e6}M context`;if(n>=1e3&&n%1e3===0)return`${n/1e3}k context`;return`${n.toLocaleString()} context`}
function showModels(models){const root=q("#models"),select=q("#command-model"),selected=select.value,sig=JSON.stringify(models);if(sig===shownModels&&root.querySelector(".model:not(.skeleton-model)"))return;shownModels=sig;modelList=models;root.replaceChildren();select.replaceChildren();for(const model of models){const option=document.createElement("option");option.value=model.id;option.textContent=model.id;select.append(option);const row=document.createElement("div"),main=document.createElement("div"),id=document.createElement("code"),context=document.createElement("span"),efforts=document.createElement("div");row.className="model";main.className="model-main";id.textContent=model.id;id.title=model.name||model.id;context.className="model-context muted";context.textContent=fmtContext(model.context_length);efforts.className="efforts";const modes=Array.isArray(model.supported_reasoning_efforts)?model.supported_reasoning_efforts:[];if(modes.length){for(const mode of modes){const badge=document.createElement("span");badge.className="effort";badge.textContent=mode;efforts.append(badge)}}else{const empty=document.createElement("span");empty.className="efforts-empty";empty.textContent="effort modes not reported";efforts.append(empty)}main.append(id,context);row.append(main,efforts);root.append(row)}if(selected&&models.some(m=>m.id===selected))select.value=selected;select.disabled=false;if(!models.length){root.textContent="no models available";select.hidden=true;select.disabled=true}else select.hidden=false;showCommands()}

// OMP has no base URL flag; its litellm provider reads one from the
// environment and discovers the proxy's models from /models.

  const root=q("#commands"),model=q("#command-model").value,selected=modelList.find(item=>item.id===model),context=Number(selected?.context_length)||0,claudeModel=context>=1e6&&!/\[1m\]$/i.test(model)?`${model}[1m]`:model,named=keysInfo?.keys.find(k=>k.name===q("#command-key").value),urls=named&&keysInfo.public_dialects.length?keysInfo.public_dialects:dialects,openai=urls.find(d=>d.name==="openai")?.base_url,anthropic=urls.find(d=>d.name==="anthropic")?.base_url,clientKey=named?.key||key||"local";

q("#command-model").onchange=showCommands;q("#command-key").onchange=showCommands;
// Named keys (master only): each with its usage per provider, a share link
// that opens that key's own reduced dashboard, and revocation.
function usageLines(root,usage){for(const [provider,windows] of Object.entries(usage||{}))showTokens(root,windows,provider);if(!root.children.length){const none=document.createElement("div");none.className="limit muted";none.textContent="no proxy tokens yet";root.append(none)}}
function keyButton(label,run){const b=document.createElement("button");b.textContent=label;b.onclick=async()=>{try{await run(b)}catch(e){alert(e.message)}};return b}
async function copied(button,text){await navigator.clipboard.writeText(text);button.textContent="copied";setTimeout(()=>button.textContent=button.dataset.label,1500)}
function showKeys(info){keysInfo=info;const root=q("#keys"),select=q("#command-key"),chosen=select.value;root.replaceChildren();select.replaceChildren(new Option("master key","master"));for(const k of [{name:"master"},...info.keys]){const item=document.createElement("div"),head=document.createElement("div"),name=document.createElement("strong"),actions=document.createElement("span"),usage=document.createElement("div");item.className="key-item";head.className="key-head";actions.className="key-actions";usage.className="usage";name.textContent=k.name;head.append(name);if(k.key){const masked=document.createElement("code"),link=`${info.public_url||location.origin}/#key=${encodeURIComponent(k.key)}`;masked.textContent=`${k.key.slice(0,8)}…${k.key.slice(-4)}`;head.append(masked);for(const [label,run] of [["copy key",b=>copied(b,k.key)],["copy link",b=>copied(b,link)],["revoke",async()=>{if(confirm(`revoke ${k.name}?`)){await api("/api/keys",{method:"POST",body:JSON.stringify({action:"remove",name:k.name})});load()}}]]){const b=keyButton(label,run);b.dataset.label=label;actions.append(b)}select.append(new Option(`key: ${k.name}`,k.name))}head.append(actions);usageLines(usage,info.usage[k.name]);item.append(head,usage);root.append(item)}if([...select.options].some(o=>o.value===chosen))select.value=chosen;showCommands()}
q("#add-key").onclick=async()=>{const input=q("#key-name");try{await api("/api/keys",{method:"POST",body:JSON.stringify({action:"add",name:input.value.trim()})});input.value="";load()}catch(e){alert(e.message)}};
q("#refresh-models").onclick=async()=>{const button=q("#refresh-models"),previous=modelList;button.disabled=true;refreshing=true;shownModels="";q("#models").replaceChildren();fillSkeleton("#models","#skeleton-model",Math.max(previous.length,4));try{showModels((await api("/v1/models?refresh=1")).data)}catch(e){showModels(previous);alert(e.message)}finally{refreshing=false;button.disabled=false}};
// One reload at a time; a call arriving meanwhile runs once it finishes.
function load(){if(loading){again=true;return loading}loading=loadOnce().finally(()=>{loading=null;if(again){again=false;load()}});return loading}
async function loadOnce(){
  const initial=!document.body.classList.contains("ready");
  const status=api("/api/me").then(async me=>{
    document.body.classList.toggle("user",me.role!=="master");
    if(me.role!=="master"){
      showDialects(me.dialects||[]);const usage=q("#usage");usage.replaceChildren();usageLines(usage,me.usage);
      q("#dot").classList.add("on");q("#state").textContent=`signed in as ${me.name}`;return;
    }
    const [value,keys]=await Promise.all([api("/api/status"),api("/api/keys")]);
    showDialects(value.dialects||[]);showKeys(keys);
    providers=value.providers||[];
    const providerRoot=q("#providers");for(const node of [...providerRoot.childNodes])if(!node.matches?.(".provider:not(.skeleton-provider)"))node.remove();
    if(!providers.length)providerRoot.textContent="no providers configured";
    for(const p of providers)showProvider(p);
    const accounts=providers.flatMap(p=>p.accounts?.length?p.accounts:[p]),on=accounts.filter(a=>a.signed_in).length;
    q("#dot").classList.toggle("on",on>0);q("#state").textContent=`${on}/${accounts.length} accounts signed in`;
  }).catch(error=>{
    if(error.status===401){
    // A key that no longer works, e.g. after the proxy regenerated one.
    // Drop it rather than retrying with it until the user clears storage.
      clearInterval(timer);timer=null;forgetKey();lock("api key rejected");
    }else{q("#dot").classList.remove("on");q("#state").textContent=`${error.message} · showing last data`;if(initial){q("#providers").textContent="unavailable";q("#clients").textContent="unavailable"}}
  });
  const models=refreshing?null:api("/v1/models").then(value=>showModels(value.data)).catch(()=>{if(initial){q("#models").textContent="unavailable";q("#command-model").hidden=true}});
  await Promise.all([status,models]);
  if(initial&&q("#commands").querySelector(".skeleton-command"))q("#commands").textContent="unavailable";
  document.body.classList.add("ready");
}
function showKey(){q("#key").textContent=key||"disabled";for(const id of["#copy","#forget"])q(id).style.display=key?"":"none"}
q("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(key);q("#copy").textContent="copied";setTimeout(()=>q("#copy").textContent="copy",1500)}catch(e){alert(e.message)}};
q("#forget").onclick=()=>{forgetKey();location.reload()};
showKey();
// Without a working key there is nothing to show, so ask for one. A pasted
// key takes the same path as a link: into the fragment, which reloads.
function lock(state){q("main").hidden=true;q("#unlock").hidden=false;q("#dot").classList.remove("on");q("#state").textContent=state;q("#unlock-key").focus()}
q("#unlock").onsubmit=event=>{event.preventDefault();const value=q("#unlock-key").value.trim();if(value)location.hash=`key=${encodeURIComponent(value)}`};
// A hidden tab stops polling (each poll reads upstream usage) and catches up
// as soon as it is shown again.
if(authRequired&&!key)lock("api key required");else{load();timer=setInterval(()=>{if(!document.hidden)load()},60000);addEventListener("visibilitychange",()=>{if(!document.hidden&&timer)load()})}
</script>
</html>
