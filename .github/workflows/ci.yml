name: ci

permissions:
  contents: read

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal -c clippy -c rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: unit tests and the conformance replay
        run: cargo test --locked
      - run: cargo build --release --locked
      - name: end to end against canned upstreams
        run: |
          python3 tests/e2e/run.py target/release/llm-local-proxy
          python3 tests/e2e/codex_login.py target/release/llm-local-proxy
