name: llm-local-proxy

services:
  proxy:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - proxy-config:/config
      - codex-home:/codex
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz')"
      # Each probe starts a Python process; checking every 10s cost more CPU at
      # idle than the proxy itself. Probe fast only while it starts up.
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s

volumes:
  proxy-config:
  codex-home: