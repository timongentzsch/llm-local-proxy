name: llm-local-proxy

services:
  proxy:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
      # The named-key listener, once public_port = 8788 is set in config.toml.
      # Publish it as widely as its users need, e.g. behind Tailscale Serve.
      # - "127.0.0.1:8788:8788"
    volumes:
      - proxy-config:/config
      - codex-home:/codex
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/llm-local-proxy", "--healthcheck"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s

volumes:
  proxy-config:
  codex-home:
