services:
  proxy:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - proxy-config:/config
      - codex-home:/codex
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz')"
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  proxy-config:
  codex-home:
